<template>
  <style>

    #chart-area { fill: url(#chart-fill); }
    #chart-end { fill: #0c0c0e; stroke: #9b87ff; stroke-width: 5; }
    .chart-x { font-size: 28px; fill: #8b8b93; font-family: "Inter", sans-serif; }
    #chart-ticker { position: absolute; left: 0; right: 0; bottom: 110px; height: 70px; overflow: hidden; border-top: 1px solid rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.07); background: rgba(23,23,28,.7); }
    #chart-tape { position: absolute; top: 0; left: 0; display: flex; gap: 70px; height: 70px; align-items: center; white-space: nowrap; font-size: 30px; color: rgba(243,238,229,.8); }

  <div id="root" data-composition-id="chart" data-width="1920" data-height="1080">
    <div id="chart-card" class="clip" data-start="0" data-duration="4">
      <div id="chart-head">
        <div><h2>Median closing merit</h2><p>Induction 21 · every programme · lower is easier</p></div>
        <div id="chart-now"><small>Round 8</small><b id="chart-val">21.86</b><em id="chart-delta">▼ 0.04</em></div>

      <svg id="chart-svg" viewBox="0 0 1496 380" preserveAspectRatio="none">
        <defs>
          <linearGradient id="chart-grad" x1="0" x2="1"><stop offset="0" stop-color="#5ce1e6" /><stop offset="1" stop-color="#9b87ff" /></linearGradient>
          <linearGradient id="chart-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgba(110,86,255,.35)" /><stop offset="1" stop-color="rgba(110,86,255,0)" /></linearGradient>

        <line class="chart-grid" x1="0" x2="1496" y1="40" y2="40" />

      <div id="chart-tape">
        <span>Chemical Pathology <span class="f">▼ 5.48</span> since round 1</span>
        <span>Radiation Oncology · CMH Rawalpindi <span class="f">▼ 3.44</span></span>

  <script>
    // Real median closing merit, induction 21, rounds 1-8 (out of 30).
    const med = [21.858, 21.5, 21.523, 21.5, 21.478, 21.402, 21.298, 21.262];
    const W = 1496, H = 380, lo = 21.2, hi = 21.9, top = 20, bottom = 300;
    const pts = med.map((v, i) => [(i / (med.length - 1)) * (W - 20) + 10, top + (1 - (v - lo) / (hi - lo)) * (bottom - top)]);
    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
    document.querySelector("#chart-line").setAttribute("d", line);
    document.querySelector("#chart-area").setAttribute("d", `${line} L${pts.at(-1)[0]} ${bottom} L${pts[0][0]} ${bottom} Z`);
    const end = document.querySelector("#chart-end");
    end.setAttribute("cx", pts.at(-1)[0]); end.setAttribute("cy", pts.at(-1)[1]);
    document.querySelector("#chart-xs").innerHTML = pts.map(([x], i) => `<text class="chart-x" x="${x}" y="350" text-anchor="middle">R${i + 1}</text>`).join("");

    const tl = gsap.timeline({ paused: true });
    // Arrives on the whip from the right, lands blurred and sharpens.
    tl.fromTo("#chart-card", { x: 700, opacity: 0, filter: "blur(18px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0);
    tl.fromTo("#chart-line", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 0.3);
    tl.fromTo("#chart-area", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 1.4);
    tl.fromTo("#chart-end", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 2.45);
    const o = { v: med[0] };
    tl.fromTo(o, { v: med[0] }, { v: med.at(-1), duration: 2.2, ease: "power2.inOut", onUpdate: () => { document.querySelector("#chart-val").textContent = o.v.toFixed(2); } }, 0.3);
    tl.fromTo("#chart-delta", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.5);
    tl.fromTo("#chart-ticker", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
    tl.fromTo("#chart-tape", { x: 0 }, { x: -1100, duration: 3.4, ease: "none" }, 0.6);
    // Dip and push out on the bar line.
    tl.to("#chart-card", { scale: 0.92, opacity: 0, filter: "blur(10px)", duration: 0.28, ease: "power3.in" }, 3.7);
    tl.to("#chart-ticker", { opacity: 0, duration: 0.2 }, 3.75);
    window.__timelines["chart"] = tl;
  </script>
