<script>
/* Signed-in users of the current app still go straight to it.
   Add ?home to the URL to stay on this page. Controlled by site.config.js. */
(function () {
  var cfg = window.MERITNAMA_CONFIG || {};
  if (!cfg.legacySessionRedirect || /[?&]home\b/.test(location.search)) return;
  try {
    var s = JSON.parse(localStorage.getItem('meritnama_auth_session'));
    if (s && s.email && typeof s.ts === 'number' && (Date.now() - s.ts) < 86400000) {
      location.replace(cfg.appUrl || 'app.html');
    }
  } catch (e) {}
})();

<style>
/* Layout: one full-bleed dim room. A glossy morphing form floats at the centre;
   "off" / "on" switches sit beside it like light switches; a thin line of text
   and a hairline progress bar rest below. "On" lights the form from inside
   with the brand ember, warms the room and starts the music.
   Colours and faces follow meritNAMA tokens v1.1. */
:root {
  --room:       #0b0b0c;   /* --mn-navy-950 (charcoal) */
  --room-lit:   #2a2b2e;   /* --mn-border, used as the cool pool of light */
  --ink:        #f4f4f5;   /* --mn-text */
  --ink-soft:   #a1a1aa;   /* --mn-text-muted */
  --ink-faint:  #8a8a93;   /* --mn-text-subtle */
  --teal:       #2dd4bf;   /* --mn-cyan */
  --ember:      #ff6a3d;   /* --mn-ember */
  --ember-hot:  #ffb08a;   /* --mn-ember-hot */
  --ember-deep: #b8321a;   /* --mn-ember-deep */

  --font-sans:    "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Archivo", "Arial Black", sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--room); color: var(--ink); font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased; }

/* ── Room: light pools, drifting fog, vignette ─────────── */
.room { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.pool { position: absolute; inset: -20%; transition: opacity 1.8s var(--ease); }
.pool.cool { background: radial-gradient(42% 46% at 50% 42%, rgba(120,124,132,.42), rgba(42,43,46,.25) 45%, rgba(11,11,12,0) 75%); }
.pool.warm { opacity: 0;
  background: radial-gradient(38% 42% at 50% 44%, rgba(255,106,61,.38), rgba(184,50,26,.16) 45%, rgba(11,11,12,0) 75%); }
body.lit .pool.warm { opacity: 1; }
body.lit .pool.cool { opacity: .35; }
.fog { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(80px); opacity: .32;
  transition: background 2s var(--ease); }
.fog.a { left: -20vmax; top: 10vh; background: rgba(45,212,191,.16); animation: fogA 38s ease-in-out infinite alternate; }
.fog.b { right: -25vmax; bottom: -20vmax; background: rgba(120,124,132,.22); animation: fogB 46s ease-in-out infinite alternate; }
body.lit .fog.a { background: rgba(255,106,61,.16); }
body.lit .fog.b { background: rgba(255,176,138,.12); }
@keyframes fogA { to { transform: translate(30vw, -12vh) scale(1.2); } }
@keyframes fogB { to { transform: translate(-28vw, -8vh) scale(.9); } }
.floor { position: absolute; left: 50%; top: calc(50% + min(26vmin, 220px)); width: min(46vmin, 380px); height: 40px;
  transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.65), rgba(0,0,0,0));
  filter: blur(6px); transition: box-shadow 1.8s; }
body.lit .floor { box-shadow: 0 0 80px 10px rgba(255,106,61,.12); }
.vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.65)); }
.grain { position: absolute; inset: -50%; opacity: .07; mix-blend-mode: overlay; animation: grain 1s steps(6) infinite;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
@keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
.fallback { position: fixed; left: 50%; top: 42%; width: min(44vmin, 360px); aspect-ratio: 1; max-width: 100%;
  transform: translate(-50%, -50%); border-radius: 46% 54% 50% 50% / 52% 44% 56% 48%; z-index: 1;
  background: radial-gradient(circle at 35% 30%, #fff, #c9cbce 35%, #6b6d72 80%); animation: morph 9s ease-in-out infinite alternate; }
@keyframes morph { to { border-radius: 56% 44% 42% 58% / 44% 58% 42% 56%; } }

/* ── Overlay UI ───────────────────────────────────────── */
.ui { position: fixed; inset: 0; z-index: 2; pointer-events: none;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }

.brand { color: var(--ink); text-decoration: none; position: absolute; top: max(22px, env(safe-area-inset-top, 0px)); left: max(22px, env(safe-area-inset-left, 0px));
  display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: 12px;
  border: 1px solid rgba(244,244,245,.28); background: rgba(18,19,20,.25);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: .95rem; font-weight: 600; letter-spacing: -.01em; animation: fadeIn 1.2s var(--ease) .2s both; }
.brand svg { width: 22px; height: 22px; color: var(--ink); }
.brand .nama { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-variation-settings: "wdth" 125; letter-spacing: .02em; }

.switch { position: absolute; width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer;
  font: 300 .9rem/1 var(--font-sans); color: var(--ink); letter-spacing: .02em;
  background: rgba(244,244,245,.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: inset 0 0 0 1px rgba(244,244,245,.1);
  transition: background .5s var(--ease), color .5s, transform .4s var(--ease), box-shadow .5s; animation: fadeIn 1.2s var(--ease) 1s both; }
.switch:hover { transform: scale(1.08); background: rgba(244,244,245,.14); }
.switch[aria-pressed="true"] { background: rgba(244,244,245,.18); box-shadow: inset 0 0 0 1px rgba(244,244,245,.28); }
.switch.off { left: calc(50% - min(30vmin, 260px)); top: calc(42% - min(18vmin, 150px)); }
.switch.on  { left: calc(50% + min(22vmin, 190px)); top: calc(42% + min(9vmin, 80px)); }
.switch.on[aria-pressed="false"]::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  box-shadow: 0 0 0 0 rgba(255,176,138,.5); animation: ring 2.4s ease-out 2.2s infinite; }
.switch.on[aria-pressed="true"] { color: #1a0d07; background: rgba(255,176,138,.92); box-shadow: 0 0 30px rgba(255,106,61,.55); }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,176,138,.45) } 100% { box-shadow: 0 0 0 22px rgba(255,176,138,0) } }
.switch:focus-visible { outline: 2px solid var(--teal); outline-offset: 4px; }

.caption { position: absolute; left: 0; right: 0; bottom: max(9vh, calc(env(safe-area-inset-bottom, 0px) + 40px));
  display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.line { position: relative; width: 100%; height: 1.3em; font-weight: 200; letter-spacing: -.02em;
  font-size: clamp(1.45rem, 1rem + 2.2vw, 2.5rem); color: rgba(244,244,245,.86); }
.line span { position: absolute; inset: 0; opacity: 0; transform: translateY(14px); filter: blur(8px);
  transition: opacity 1s var(--ease), transform 1s var(--ease), filter 1s var(--ease); white-space: nowrap; }
.line span.on { opacity: 1; transform: none; filter: none; }
.meter { display: flex; align-items: center; gap: 14px; width: min(100%, 300px); }
.track { position: relative; flex: 1; height: 2px; border-radius: 2px; background: rgba(244,244,245,.12); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, rgba(244,244,245,.5), var(--ink));
  transition: background 1.6s; }
body.lit .fill { background: linear-gradient(90deg, var(--ember-deep), var(--ember), var(--ember-hot)); box-shadow: 0 0 10px var(--ember); }
.fill::after { content: ""; position: absolute; right: 0; top: -3px; width: 8px; height: 8px; border-radius: 50%;
  background: inherit; filter: blur(3px); }
.pct { font: 400 .78rem/1 var(--font-mono); letter-spacing: .12em; color: var(--ink-faint); font-variant-numeric: tabular-nums; min-width: 6.5ch; text-align: right; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }

@media (max-width: 560px) {
  .switch { width: 50px; height: 50px; font-size: .82rem; }
  .switch.off { left: 9%; top: 18%; }
  .switch.on  { left: auto; right: 9%; top: 58%; }
  .line span { white-space: normal; }
  .line { height: 2.6em; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<div class="room" aria-hidden="true">
  <div class="pool cool"></div>
  <div class="pool warm"></div>
  <div class="fog a"></div>
  <div class="fog b"></div>
  <div class="floor"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<canvas id="gl" aria-hidden="true"></canvas>

<div class="ui">
  <a class="brand" href="./?home" aria-label="meritNAMA">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M8 56V14a4 4 0 0 1 7.3-2.3L27 28.6M56 56V14a4 4 0 0 0-7.3-2.3L37 28.6" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="28.5" y="15" width="7" height="41" rx="3.5" fill="#ff6a3d"/>
      <path d="M24.5 17 32 7l7.5 10" fill="none" stroke="#ffb08a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>merit<span class="nama">NAMA</span></span>
  </a>

  <button class="switch off" id="off" type="button" aria-pressed="true" aria-label="Lights and music off">off</button>
  <button class="switch on"  id="on"  type="button" aria-pressed="false" aria-label="Lights and music on">on</button>

  <main class="caption">
    <h1 class="line" id="line" aria-live="polite">
      <span class="on">A new meritNAMA is on its way</span>
      <span>Recomputing closing merit</span>
      <span>Redrawing seat maps</span>
      <span>Tuning the simulator</span>
      <span>Polishing every page</span>
    </h1>
    <div class="meter">
      <div class="track" role="progressbar" aria-label="Rebuild progress" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="fill"></div></div>
      <span class="pct" id="pct">0%</span>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  var cfg = window.MERITNAMA_CONFIG || {};
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PCT = typeof cfg.buildProgress === "number" ? Math.max(0, Math.min(100, cfg.buildProgress)) : 64;

  /* ── Rotating line ─────────────────────────────────── */
  var lines = document.querySelectorAll("#line span"), li = 0;
  if (!reduce) setInterval(function () { lines[li].classList.remove("on"); li = (li + 1) % lines.length; lines[li].classList.add("on"); }, 3600);

  /* ── Progress ──────────────────────────────────────── */
  var fill = document.getElementById("fill"), pctEl = document.getElementById("pct");
  document.getElementById("track").setAttribute("aria-valuenow", PCT);
  var t0 = null;
  (function grow(ts) {
    if (t0 === null) t0 = ts;
    var k = reduce ? 1 : Math.min(1, Math.max(0, (ts - t0 - 900) / 2800)), v = PCT * (1 - Math.pow(1 - k, 4));
    fill.style.width = v + "%"; pctEl.textContent = Math.round(v) + "% built";
    if (k < 1) requestAnimationFrame(grow);
  })(performance.now());

  /* ── Light state ───────────────────────────────────── */
  var lit = false, light = 0, lightTarget = 0, flickerUntil = 0;
  var offBtn = document.getElementById("off"), onBtn = document.getElementById("on");
  function setLit(v) {
    if (v === lit) return;
    lit = v; lightTarget = v ? 1 : 0;
    if (v) flickerUntil = performance.now() + 650;
    document.body.classList.toggle("lit", v);
    onBtn.setAttribute("aria-pressed", String(v)); offBtn.setAttribute("aria-pressed", String(!v));
    v ? play() : pause();
    try { localStorage.setItem("meritnama_light", v ? "on" : "off"); } catch (e) {}
  }
  onBtn.addEventListener("click", function () { setLit(true); });
  offBtn.addEventListener("click", function () { setLit(false); });
  window.addEventListener("keydown", function (e) { if (e.key === "l" || e.key === "L" || e.key === "m" || e.key === "M") setLit(!lit); });

  /* ── Pointer ───────────────────────────────────────── */
  var px = 0, py = 0, sx = 0, sy = 0, wob = 0, lastX = 0, lastY = 0;
  window.addEventListener("pointermove", function (e) {
    var nx = e.clientX / innerWidth - .5, ny = e.clientY / innerHeight - .5;
    wob = Math.min(1, wob + Math.hypot(nx - lastX, ny - lastY) * 4);
    lastX = nx; lastY = ny; px = nx; py = ny;
  });

  /* ── Music (synthesized live) ──────────────────────── */
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var ctx, master, bus, analyser, freq, playing = false, nextChord = 0, chordIx = 0, timer;
  var CHORDS = [[48, 55, 59, 64], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 55, 62]], MELODY = [72, 74, 76, 79, 81, 84], BAR = 8;
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function impulse(sec, decay) {
    var len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = b.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function setup() {
    ctx = new Ctx();
    master = ctx.createGain(); master.gain.value = 0;
    var comp = ctx.createDynamicsCompressor();
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; freq = new Uint8Array(analyser.frequencyBinCount);
    master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300; lp.Q.value = .4;
    var lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = .05; lfoG.gain.value = 500;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    var rev = ctx.createConvolver(); rev.buffer = impulse(5, 2.4);
    var wet = ctx.createGain(); wet.gain.value = .7;
    var dry = ctx.createGain(); dry.gain.value = .5;
    bus = ctx.createGain(); bus.gain.value = .9;
    bus.connect(lp); lp.connect(dry); lp.connect(rev); rev.connect(wet); dry.connect(master); wet.connect(master);
    var nb = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate), nd = nb.getChannelData(0), last = 0;
    for (var i = 0; i < nd.length; i++) { var w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; nd[i] = last * 3.2 + (Math.random() < .0004 ? (Math.random() - .5) * .6 : 0); }
    var ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    var nf = ctx.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 1100; nf.Q.value = .6;
    var ng = ctx.createGain(); ng.gain.value = .06;
    ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
  }
  function voice(f, st, dur, type, peak, det) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f; o.detune.value = det || 0;
    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(peak, st + 2.4);
    g.gain.setValueAtTime(peak, st + dur - 2.6); g.gain.linearRampToValueAtTime(0, st + dur + 1.8);
    o.connect(g); g.connect(bus); o.start(st); o.stop(st + dur + 2);
  }
  function pluck(f, st) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(.05, st + .015);
    g.gain.exponentialRampToValueAtTime(.0001, st + 2.2);
    o.connect(g); g.connect(bus); o.start(st); o.stop(st + 2.3);
  }
  function schedule() {
    while (nextChord < ctx.currentTime + 1.5) {
      var ch = CHORDS[chordIx % CHORDS.length];
      ch.forEach(function (m) { voice(hz(m), nextChord, BAR, "triangle", .035, -7); voice(hz(m), nextChord, BAR, "sine", .03, 6); });
      voice(hz(ch[0] - 12), nextChord, BAR, "sine", .06, 0);
      for (var b = 0; b < 8; b++) if (Math.random() < .38) pluck(hz(MELODY[(Math.random() * MELODY.length) | 0]), nextChord + b + Math.random() * .2);
      nextChord += BAR; chordIx++;
    }
  }
  function play() {
    if (!Ctx) return;
    if (!ctx) setup();
    ctx.resume();
    if (nextChord < ctx.currentTime) nextChord = ctx.currentTime + .1;
    schedule(); clearInterval(timer); timer = setInterval(schedule, 400);
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.55, ctx.currentTime + 2.5);
    playing = true;
  }
  function pause() {
    if (!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
    clearInterval(timer); setTimeout(function () { if (!playing) ctx.suspend(); }, 1400);
    playing = false;
  }

  /* ── WebGL scene ───────────────────────────────────── */
  var canvas = document.getElementById("gl");
  if (!window.THREE || !(function () { try { return !!canvas.getContext("webgl"); } catch (e) { return false; } })()) {
    canvas.remove();
    var fb = document.createElement("div"); fb.className = "fallback"; fb.setAttribute("aria-hidden", "true");
    document.body.insertBefore(fb, document.querySelector(".ui"));
    return;
  }
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, 1, .1, 100);
  camera.position.set(0, 0, 7);

  var NOISE = [
    "vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}",
    "vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}",
    "vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}",
    "vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}",
    "float snoise(vec3 v){const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);",
    "vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;",
    "vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;",
    "i=mod289(i);vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));",
    "float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);",
    "vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);",
    "vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;",
    "vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);",
    "vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;",
    "vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;",
    "return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}"
  ].join("\n");

  var uniforms = {
    uTime: { value: 0 }, uAmp: { value: .16 }, uFreq: { value: .62 },
    uLight: { value: 0 }, uEnergy: { value: 0 },
    uCool: { value: new THREE.Color("#2dd4bf") }, uWarm: { value: new THREE.Color("#ff6a3d") },
    uHot: { value: new THREE.Color("#ffb08a") }, uDeep: { value: new THREE.Color("#b8321a") }
  };
  var material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: [
      "uniform float uTime; uniform float uAmp; uniform float uFreq;",
      "varying vec3 vN; varying vec3 vView; varying float vDisp;",
      NOISE,
      "float disp(vec3 p){ float t=uTime;",
      "  return snoise(p*uFreq+vec3(t*.16,t*.12,t*.09))*uAmp + snoise(p*uFreq*1.7-vec3(t*.1))*uAmp*.12; }",
      "vec3 place(vec3 p){ vec3 n=normalize(p); return n*(1.0+disp(n)); }",
      "void main(){",
      "  vec3 n=normalize(position);",
      "  vec3 t=normalize(cross(n, abs(n.y)<.99?vec3(0.,1.,0.):vec3(1.,0.,0.)));",
      "  vec3 b=normalize(cross(n,t));",
      "  vec3 p0=place(n); vec3 p1=place(n+t*.012); vec3 p2=place(n+b*.012);",
      "  vec3 nn=normalize(cross(p1-p0,p2-p0)); if(dot(nn,n)<0.) nn=-nn;",
      "  vDisp=disp(n);",
      "  vec4 mv=modelViewMatrix*vec4(p0,1.);",
      "  vN=normalize(normalMatrix*nn); vView=-mv.xyz;",
      "  gl_Position=projectionMatrix*mv; }"
    ].join("\n"),
    fragmentShader: [
      "uniform float uLight; uniform float uEnergy; uniform vec3 uCool; uniform vec3 uWarm; uniform vec3 uHot; uniform vec3 uDeep;",
      "varying vec3 vN; varying vec3 vView; varying float vDisp;",
      "void main(){",
      "  vec3 N=normalize(vN); vec3 V=normalize(vView);",
      "  float ndv=max(dot(N,V),0.);",
      "  vec3 L1=normalize(vec3(-.55,.85,.55)); vec3 L2=normalize(vec3(.75,-.25,.45));",
      "  float wrap=dot(N,L1)*.5+.5;",
      "  vec3 ceramic=vec3(.80,.81,.82);",
      "  vec3 col=ceramic*(.10+.80*wrap*wrap) + ceramic*.08*(N.y*.5+.5);",
      "  vec3 R=reflect(-V,N);",
      "  vec3 sky=mix(vec3(.88,.9,.92), mix(uCool*.9+.15, uHot, uLight), .35);",
      "  vec3 env=mix(vec3(.03), sky, smoothstep(-.15,.85,R.y));",
      "  float fres=pow(1.-ndv,3.);",
      "  col=mix(col, env, .18+.55*fres);",
      "  vec3 H1=normalize(L1+V); float s1=max(dot(N,H1),0.);",
      "  vec3 H2=normalize(L2+V); float s2=max(dot(N,H2),0.);",
      "  col+=vec3(1.)*(pow(s1,140.)*1.4+pow(s1,18.)*.10);",
      "  col+=mix(uCool,uHot,uLight)*pow(s2,60.)*.35;",
      /* lit from inside: warm core that shows through thin, facing areas */
      "  float core=pow(ndv,1.3);",
      "  vec3 glow=uDeep*.32 + uWarm*core*.62 + uHot*pow(ndv,6.)*.42;",
      "  glow*=1.+vDisp*1.5+uEnergy*.7;",
      "  vec3 shell=col*.12 + vec3(1.,.9,.85)*pow(s1,140.)*1.1;",
      "  col=mix(col, shell+glow, uLight);",
      "  col+=uWarm*fres*.4*uLight;",
      "  col=col/(1.+col*.35); col=pow(col,vec3(.92));",
      "  gl_FragColor=vec4(col,1.);",
      "}"
    ].join("\n")
  });
  var blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 96), material);
  scene.add(blob);

  /* Dust motes drifting through the light */
  var COUNT = innerWidth < 600 ? 260 : 520, pos = new Float32Array(COUNT * 3), seeds = new Float32Array(COUNT);
  for (var i = 0; i < COUNT; i++) {
    var r = 1.8 + Math.random() * 3.6, th = Math.random() * 6.283, ph = Math.acos(Math.random() * 2 - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.cos(ph) * .7; pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th) - 1;
    seeds[i] = Math.random();
  }
  var dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  dustGeo.setAttribute("seed", new THREE.BufferAttribute(seeds, 1));
  var dustMat = new THREE.ShaderMaterial({
    uniforms: { uTime: uniforms.uTime, uLight: uniforms.uLight, uPR: { value: renderer.getPixelRatio() } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: [
      "uniform float uTime; uniform float uPR; attribute float seed; varying float vA;",
      "void main(){ vec3 p=position; float t=uTime*(.05+seed*.06);",
      "  p.y+=sin(t*6.283+seed*20.)*.25; p.x+=cos(t*4.+seed*11.)*.2;",
      "  vec4 mv=modelViewMatrix*vec4(p,1.);",
      "  vA=(.25+.75*fract(seed*7.31))*(.6+.4*sin(uTime*(.6+seed)+seed*30.));",
      "  gl_PointSize=(1.2+seed*2.6)*uPR*(6./-mv.z); gl_Position=projectionMatrix*mv; }"
    ].join("\n"),
    fragmentShader: [
      "uniform float uLight; varying float vA;",
      "void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,0.,d)*vA;",
      "  vec3 c=mix(vec3(.75,.8,.82), vec3(1.,.62,.42), uLight);",
      "  gl_FragColor=vec4(c, a*(.35+.45*uLight)); }"
    ].join("\n")
  });
  var dust = new THREE.Points(dustGeo, dustMat);
  scene.add(dust);

  function resize() {
    var w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.setViewOffset(w, h, 0, h * .08, w, h); // lift the form above the caption
    camera.updateProjectionMatrix();
    var s = Math.min(1, Math.max(.62, Math.min(w, h * 1.1) / 900));
    blob.scale.setScalar(s * (w < 560 ? .92 : 1));
  }
  resize(); window.addEventListener("resize", resize);

  var energy = 0, last = performance.now(), running = true, time = 0;
  document.addEventListener("visibilitychange", function () { running = !document.hidden; if (running) { last = performance.now(); requestAnimationFrame(frame); } });
  function frame(now) {
    if (!running) return;
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    time += dt * (reduce ? .15 : 1);
    uniforms.uTime.value = time;

    if (analyser && playing) {
      analyser.getByteFrequencyData(freq);
      var sum = 0; for (var i = 0; i < 24; i++) sum += freq[i];
      energy += (sum / (24 * 255) - energy) * (1 - Math.exp(-dt * 4));
    } else energy *= .96;
    uniforms.uEnergy.value = energy;

    // light eases in with a short switch-on flicker
    light += (lightTarget - light) * (1 - Math.exp(-dt * (lit ? 2.2 : 3)));
    var shown = light;
    if (now < flickerUntil) { var k = (flickerUntil - now) / 650; shown = light * (k > .7 ? .9 : k > .55 ? .15 : k > .4 ? .7 : k > .3 ? .3 : 1); }
    uniforms.uLight.value = shown;

    wob *= Math.exp(-dt * 2.5);
    uniforms.uAmp.value = .16 + wob * .08 + energy * .12;
    var ek = 1 - Math.exp(-dt * 2.4); sx += (px - sx) * ek; sy += (py - sy) * ek;
    blob.rotation.y = time * .12 + sx * .9;
    blob.rotation.x = Math.sin(time * .1) * .2 + sy * .6;
    blob.position.y = Math.sin(time * .6) * .06;
    dust.rotation.y = time * .015 - sx * .25;
    camera.position.x = sx * .5; camera.position.y = -sy * .35; camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
