<style>
/* The entry: the 30-second film full screen, a way in to the new site, and the way back to the
   previous one. Colours are the new site's: charcoal ground, ivory ink, violet action. */
:root {
  --ground: #0c0c0e;
  --ink: #f3eee5;
  --ink-dim: rgba(243, 238, 229, .72);
  --line: rgba(243, 238, 229, .16);
  --violet: #7b61ff;
  --violet-soft: #9b87ff;
  --violet-pale: #d6ccff;
  --green: #3ddc97;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.stage { position: fixed; inset: 0; overflow: hidden; background: var(--ground); }
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--ground); }
/* Portrait screens see the whole 16:9 film rather than a crop of its middle. */
@media (max-aspect-ratio: 1/1) { .stage video { object-fit: contain; object-position: center 32%; } }
.shade { position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(180deg, rgba(12,12,14,.55) 0%, rgba(12,12,14,0) 18%),
  linear-gradient(0deg, rgba(12,12,14,.92) 0%, rgba(12,12,14,.35) 22%, rgba(12,12,14,0) 40%); }

header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: max(18px, env(safe-area-inset-top)) clamp(16px, 4vw, 44px) 0; z-index: 2; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 19px; letter-spacing: -.01em; }
.brand svg { width: 30px; height: 29px; }
.brand b { font-weight: 800; letter-spacing: .02em; }
.ghost { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(12,12,14,.45); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: border-color .2s, box-shadow .2s; }
.ghost:hover, .ghost:focus-visible { border-color: rgba(155,135,255,.7); box-shadow: 0 0 18px rgba(110,86,255,.35); }
.ghost svg { width: 16px; height: 16px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 clamp(16px, 4vw, 44px) max(22px, env(safe-area-inset-bottom)); display: grid; gap: 16px; }
.dock-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 28px; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-dim); }
.live i { width: 8px; height: 8px; border-radius: 99px; background: var(--green); box-shadow: 0 0 10px var(--green); }
.dock h1 { margin: 8px 0 0; font-size: clamp(28px, 4.2vw, 56px); line-height: 1.04; letter-spacing: -.035em; font-weight: 900; max-width: 15ch; }
.dock h1 em { font-style: normal; color: var(--violet-soft); }
.dock p.sub { margin: 10px 0 0; max-width: 46ch; font-size: clamp(15px, 1.3vw, 17px); line-height: 1.5; color: var(--ink-dim); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.enter { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 16px; text-decoration: none; color: #fff; font-size: 17px; font-weight: 700; background: linear-gradient(90deg, rgba(255,255,255,.05) 20%, rgba(110,86,255,.55)); border: 1.5px solid rgba(155,135,255,.8); box-shadow: inset -4px 0 0 var(--violet), 0 0 34px rgba(110,86,255,.5); transition: box-shadow .2s, border-color .2s, transform .2s; }
.enter:hover, .enter:focus-visible { border-color: rgba(214,204,255,1); box-shadow: inset -4px 0 0 var(--violet-soft), 0 0 50px rgba(110,86,255,.8); }
.enter svg { width: 18px; height: 18px; }
.enter.big { height: 64px; padding: 0 32px; font-size: 19px; }
.prev { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-dim); border-top: 1px solid var(--line); padding-top: 14px; }
.prev span { color: rgba(243,238,229,.5); }
.prev a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(243,238,229,.3); }
.prev a:hover, .prev a:focus-visible { color: var(--violet-pale); border-color: var(--violet-soft); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(243,238,229,.08); z-index: 3; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5ce1e6, var(--violet-soft)); }

/* The intro copy steps back while the film plays, and comes forward when it ends. */
.intro { transition: opacity .5s ease, transform .5s ease; }
body.playing .intro { opacity: 0; transform: translateY(8px); pointer-events: none; }
body.playing .shade { opacity: .55; }
.shade { transition: opacity .6s ease; }
.replay[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) { .intro, .shade, .enter, .ghost { transition: none; } }
/* On portrait screens the film sits above the copy, so the copy can stay while it plays. */
@media (max-aspect-ratio: 1/1) { body.playing .intro { opacity: 1; transform: none; pointer-events: auto; } }
@media (max-width: 640px) {
  .dock-row { align-items: stretch; }
  .dock .actions { width: 100%; }
  .dock .enter { flex: 1; justify-content: center; }
}
</style>
</head>
<body>
<div class="stage" aria-hidden="false">
  <video id="film" playsinline muted preload="auto" poster="assets/video/meritnama-poster.jpg" aria-label="meritNAMA, a 30 second film of the new landing page: every merit list, the free marks check, the features, open jobs and the record so far.">
    <source src="assets/video/meritnama-30s-720.mp4" type="video/mp4" media="(max-width: 900px)">
    <source src="assets/video/meritnama-30s-1080.mp4" type="video/mp4">
  </video>
  <div class="shade"></div>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>
</div>

<header>
  <a class="brand" href="https://meritnama.online/" data-new-site aria-label="meritNAMA, open the new site">
    <svg viewBox="0 0 110 106" aria-hidden="true"><path d="M14 90 V44 a13 13 0 0 1 26 0 V90 M40 44 a13 13 0 0 1 26 0 a14 14 0 1 1 28 0 a14 14 0 1 1 -28 0 V98" fill="none" stroke="#F3EEE5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="12" r="6.5" fill="#9B87FF"/></svg>
    <span>merit<b>NAMA</b></span>
  </a>
  <div class="actions">
    <button class="ghost" id="sound" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" opacity=".35"/></svg>
      <span id="sound-label">Sound on</span>
    </button>
    <button class="ghost replay" id="replay" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Replay
    </button>
  </div>
</header>

<main class="dock">
  <div class="dock-row">
    <div class="intro">
      <span class="live"><i></i> The new meritNAMA is live</span>
      <h1>Every merit list, <em>made legible.</em></h1>
      <p class="sub">Closing merit by round, every seat, the estimated next list and your own chances, for postgraduate inductions.</p>
    </div>
    <div class="actions">
      <a class="enter big" href="https://meritnama.online/" data-new-site>Enter meritNAMA
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
  <nav class="prev" aria-label="Previous site">
    <span>Previous site:</span>
    <a href="app.html" data-app-link>Open the current version</a>
    <a href="home-legacy.html">Classic home</a>
    <a href="story.html">What changed in the new one</a>
  </nav>
</main>

<script>
(function () {
  "use strict";
  var cfg = window.MERITNAMA_CONFIG || {};
  var NEW_URL = cfg.newSiteUrl || "https://meritnama.online/";
  document.querySelectorAll("[data-new-site]").forEach(function (a) { a.href = NEW_URL; });
  if (cfg.appUrl) document.querySelectorAll("[data-app-link]").forEach(function (a) { a.href = cfg.appUrl; });

  var film = document.getElementById("film");
  var sound = document.getElementById("sound");
  var label = document.getElementById("sound-label");
  var wave = document.getElementById("wave");
  var replay = document.getElementById("replay");
  var progress = document.getElementById("progress");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function setSound(on) {
    film.muted = !on;
    sound.setAttribute("aria-pressed", on ? "true" : "false");
    label.textContent = on ? "Sound off" : "Sound on";
    wave.setAttribute("opacity", on ? "1" : ".35");
  }
  function play() {
    var p = film.play();
    if (p && p.catch) p.catch(function () { document.body.classList.remove("playing"); });
  }

  film.addEventListener("play", function () { document.body.classList.add("playing"); replay.hidden = true; });
  film.addEventListener("pause", function () { document.body.classList.remove("playing"); });
  film.addEventListener("ended", function () { document.body.classList.remove("playing"); replay.hidden = false; });
  film.addEventListener("timeupdate", function () {
    if (film.duration) progress.style.width = (film.currentTime / film.duration * 100).toFixed(2) + "%";
  });

  // Sound needs a tap (browsers start videos muted). Turning it on part-way restarts the film.
  sound.addEventListener("click", function () {
    var on = film.muted;
    setSound(on);
    if (on && (film.ended || film.currentTime > 1.5)) film.currentTime = 0;
    play();
  });
  replay.addEventListener("click", function () { film.currentTime = 0; play(); });
  film.addEventListener("click", function () { if (film.paused) play(); else film.pause(); });

  // Reduced motion: the poster stays until someone presses play (Sound on or Replay).
  if (reduce) { replay.hidden = false; } else { play(); }
})();
</script>
