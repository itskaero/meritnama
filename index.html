<!DOCTYPE html>
<html lang="en">
<head>

<script>
/* Signed-in users of the current app still go straight to it.
   Add ?home to the URL to stay on this page. Controlled by site.config.js. */
(function () {
  var cfg = window.MERITNAMA_CONFIG || {};
  if (!cfg.legacySessionRedirect || /[?&]home\b/.test(location.search)) return;
  try {
    var s = JSON.parse(localStorage.getItem('meritnama_auth_session'));
    if (s && s.email && typeof s.ts === 'number' && (Date.now() - s.ts) < 86400000) {
      location.replace(cfg.appUrl || 'app.html');
    }
  } catch (e) {}
})();
</script>
<style>
/* Layout: one centred stack (mark, wordmark, status line, progress bar)
   floating under a slow, soft aurora. Palette and fonts follow meritNAMA-app tokens. */
:root {
  --night:      #07111f;   /* --mn-navy-950 */
  --night-2:    #0e1b2c;   /* --mn-navy-900 */
  --ink:        #f2f6fc;   /* --mn-text */
  --ink-soft:   #a8b8ca;   /* --mn-text-muted */
  --ink-faint:  #7d90a6;   /* --mn-text-subtle */
  --cyan:       #42d6d0;   /* --mn-cyan */
  --cyan-2:     #6be3de;   /* --mn-cyan-strong */
  --green:      #5fd39a;   /* --mn-success */
  --teal:       #1f7f80;

  --font-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--font-display); overflow: hidden;
  -webkit-font-smoothing: antialiased; cursor: default;
}

/* ── Sky ───────────────────────────────────────────── */
.sky { position: fixed; inset: -6%; z-index: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 115%, var(--night-2) 0%, var(--night) 62%);
  transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.sky canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#aurora { mix-blend-mode: screen; filter: blur(28px) saturate(1.05); opacity: .9; transform: scale(1.08); }
.glyph { position: absolute; bottom: -40px; font-family: var(--font-mono); color: var(--ink-faint);
  white-space: nowrap; opacity: 0; animation: drift linear infinite; }
@keyframes drift {
  0% { transform: translate(0,0) rotate(var(--r)); opacity: 0 }
  15% { opacity: var(--o) } 85% { opacity: var(--o) }
  100% { transform: translate(var(--dx), -110vh) rotate(calc(var(--r) * -1)); opacity: 0 }
}


/* ── Centre stage ──────────────────────────────────── */
.stage { position: relative; z-index: 1; height: 100%;
  display: grid; place-items: center; text-align: center;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px; }
.stack { width: min(100%, 640px); display: flex; flex-direction: column; align-items: center; gap: 22px;
  transition: transform .8s cubic-bezier(.2,.8,.2,1); }

.mark { width: 54px; height: 54px; color: var(--cyan);
  filter: drop-shadow(0 0 18px rgba(66,214,208,.45)); animation: float 6s ease-in-out infinite; }
.mark rect { transform-box: fill-box; transform-origin: bottom; animation: grow 2.4s cubic-bezier(.3,.7,.2,1) infinite alternate; }
.mark rect:nth-child(2) { animation-delay: .2s } .mark rect:nth-child(3) { animation-delay: .4s }
@keyframes grow { from { transform: scaleY(.35) } to { transform: scaleY(1) } }
@keyframes float { 50% { transform: translateY(-8px) } }

h1 { margin: 0; font-weight: 800; letter-spacing: -.04em; line-height: 1;
  font-size: clamp(2.6rem, 6.4vw, 5rem); }
h1 .ch { display: inline-block; animation: in 1.1s cubic-bezier(.2,.8,.2,1) both, bob 5s ease-in-out infinite; }
h1 .accent { background: linear-gradient(100deg, var(--green), var(--cyan), var(--cyan-2), var(--green));
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: in 1.1s cubic-bezier(.2,.8,.2,1) both, bob 5s ease-in-out infinite, flow 6s linear infinite; }
@keyframes in { from { opacity: 0; transform: translateY(.5em) rotate(8deg); filter: blur(10px) } }
@keyframes bob { 50% { transform: translateY(-.05em) } }
@keyframes flow { to { background-position: 300% 50% } }

.rotator { position: relative; height: 1.6em; width: 100%; font-family: var(--font-mono);
  font-size: clamp(.82rem, .78rem + .25vw, .95rem); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.rotator span { position: absolute; inset: 0; opacity: 0; transform: translateY(10px); filter: blur(6px);
  transition: opacity .7s, transform .7s, filter .7s; }
.rotator span.on { opacity: 1; transform: none; filter: none; }

/* Progress bar */
.progress { width: min(100%, 460px); margin-top: 14px; }
.track { position: relative; height: 12px; border-radius: 999px; overflow: visible;
  background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; overflow: hidden;
  background: linear-gradient(90deg, var(--green), var(--cyan), var(--cyan-2), var(--green));
  background-size: 200% 100%; animation: flow 4s linear infinite;
  box-shadow: 0 0 18px rgba(66,214,208,.3); }
.fill::before { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(-45deg, rgba(255,255,255,.08) 0 8px, transparent 8px 16px);
  animation: stripes 1s linear infinite; }
@keyframes stripes { to { background-position: 22.6px 0 } }
.fill::after { content: ""; position: absolute; inset: 0; width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
  animation: sheen 2.4s ease-in-out infinite; }
@keyframes sheen { from { transform: translateX(-120%) } to { transform: translateX(320%) } }
.head { position: absolute; top: 50%; left: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.8), 0 0 26px rgba(66,214,208,.6);
  animation: beat 1.1s ease-in-out infinite; }
@keyframes beat { 0%,100% { transform: scale(.7) } 12% { transform: scale(1.15) } 24% { transform: scale(.8) } 36% { transform: scale(1) } }
#sparks { position: absolute; left: -40px; top: -60px; width: calc(100% + 80px); height: 132px; pointer-events: none; }
.pct { margin-top: 14px; font-family: var(--font-mono); font-size: .8rem; letter-spacing: .14em; color: var(--ink-faint);
  font-variant-numeric: tabular-nums; }
.pct b { color: var(--ink); font-weight: 500; }

.sound { position: fixed; z-index: 2; top: max(18px, env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; align-items: flex-end; gap: 3px; height: 18px; padding: 0; background: none; border: 0; cursor: pointer; opacity: .75; }
.sound i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--green); transition: height .3s; }
.sound.on i { animation: eq 1s ease-in-out infinite; }
.sound.on i:nth-child(2) { animation-delay: -.25s } .sound.on i:nth-child(3) { animation-delay: -.5s }
.sound.on i:nth-child(4) { animation-delay: -.75s } .sound.on i:nth-child(5) { animation-delay: -.4s }
@keyframes eq { 50% { height: 18px } }
.sound:focus-visible { outline: 2px solid var(--cyan); outline-offset: 6px; border-radius: 4px; }

.note { position: fixed; z-index: 2; left: 0; right: 0; bottom: max(26px, calc(env(safe-area-inset-bottom, 0px) + 22px));
  text-align: center; font-family: var(--font-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-faint); transition: opacity 1s; animation: pulseText 2.6s ease-in-out infinite; }
.note.gone { opacity: 0; }
@keyframes pulseText { 50% { color: var(--ink-soft) } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .glyph, #sparks { display: none; }
}
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true">
  <canvas id="stars"></canvas>
  <canvas id="aurora"></canvas>
  <div id="glyphs"></div>
</div>


<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-mark" viewBox="0 0 32 32" fill="currentColor"><rect x="3" y="18" width="5" height="10" rx="1.5" opacity=".55"/><rect x="10" y="12" width="5" height="16" rx="1.5" opacity=".75"/><rect x="17" y="7" width="5" height="21" rx="1.5"/><path d="M24 4h5v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m29 4-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
</svg>

<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Play background music"><i></i><i></i><i></i><i></i><i></i></button>

<main class="stage">
  <div class="stack" id="stack">
    <svg class="mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="3" y="18" width="5" height="10" rx="1.5" opacity=".55"/><rect x="10" y="12" width="5" height="16" rx="1.5" opacity=".75"/><rect x="17" y="7" width="5" height="21" rx="1.5"/><path d="M24 4h5v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m29 4-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <h1 id="title" aria-label="MeritNama is coming back">MeritNama</h1>
    <div class="rotator" id="rotator" aria-live="polite">
      <span class="on">A new MeritNama is on its way</span>
      <span>Recomputing closing merit</span>
      <span>Redrawing seat maps</span>
      <span>Tuning the simulator</span>
      <span>Polishing every page</span>
    </div>
    <div class="progress">
      <div class="track" role="progressbar" aria-label="Rebuild progress" aria-valuemin="0" aria-valuemax="100" id="track">
        <canvas id="sparks"></canvas>
        <div class="fill" id="fill"></div>
        <div class="head" id="head"></div>
      </div>
      <div class="pct"><b id="pct">0</b>% built</div>
    </div>
  </div>
</main>

<div class="note" id="note">Tap anywhere for sound</div>

<script>
(function () {
  "use strict";
  var cfg = window.MERITNAMA_CONFIG || {};
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PCT = typeof cfg.buildProgress === "number" ? Math.max(0, Math.min(100, cfg.buildProgress)) : 64;

  /* ── Title: per-letter entrance, second word in aurora gradient ── */
  var title = document.getElementById("title");
  title.textContent = "";
  ["Merit", "Nama"].forEach(function (word, wi) {
    word.split("").forEach(function (c, i) {
      var s = document.createElement("span");
      s.className = "ch" + (wi ? " accent" : "");
      s.setAttribute("aria-hidden", "true");
      s.textContent = c;
      var k = wi * 5 + i;
      s.style.animationDelay = (k * 0.06) + "s, " + (1.2 + k * 0.12) + "s" + (wi ? ", 0s" : "");
      title.appendChild(s);
    });
  });

  /* ── Rotating status line ─────────────────────────── */
  var lines = document.querySelectorAll("#rotator span"), li = 0;
  if (!reduce) setInterval(function () {
    lines[li].classList.remove("on"); li = (li + 1) % lines.length; lines[li].classList.add("on");
  }, 3200);

  /* ── Progress bar ─────────────────────────────────── */
  var fill = document.getElementById("fill"), head = document.getElementById("head"), pctEl = document.getElementById("pct");
  document.getElementById("track").setAttribute("aria-valuenow", PCT);
  var shown = 0, start = null;
  function ease(k) { return 1 - Math.pow(1 - k, 4); }
  function grow(ts) {
    if (start === null) start = ts;
    var k = reduce ? 1 : Math.min(1, Math.max(0, (ts - start - 600) / 2600));
    shown = PCT * ease(k);
    fill.style.width = shown + "%"; head.style.left = shown + "%";
    pctEl.textContent = Math.round(shown);
    if (k < 1) requestAnimationFrame(grow);
  }
  requestAnimationFrame(grow);

  /* Sparks streaming off the bar's leading edge */
  var spc = document.getElementById("sparks"), spx = spc.getContext("2d"), sparks = [];
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function sizeSparks() { spc.width = spc.clientWidth * dpr; spc.height = spc.clientHeight * dpr; spx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  sizeSparks();
  var COLS = ["95,211,154", "66,214,208", "107,227,222", "242,246,252"];
  function sparkFrame() {
    var w = spc.clientWidth, h = spc.clientHeight, x0 = 40 + (w - 80) * shown / 100, y0 = h / 2;
    for (var n = 0; n < 2; n++) sparks.push({ x: x0, y: y0, vx: -Math.random() * 1.8 - .2, vy: (Math.random() - .5) * 1.6, life: 1, r: Math.random() * 1.8 + .6, c: COLS[(Math.random() * 4) | 0] });
    spx.clearRect(0, 0, w, h);
    spx.globalCompositeOperation = "lighter";
    for (var i = sparks.length - 1; i >= 0; i--) {
      var p = sparks[i]; p.x += p.vx; p.y += p.vy; p.vy *= .97; p.life -= .018;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      spx.fillStyle = "rgba(" + p.c + "," + (p.life * .9).toFixed(2) + ")";
      spx.beginPath(); spx.arc(p.x, p.y, p.r * p.life, 0, 6.283); spx.fill();
    }
  }

  /* ── Drifting study glyphs ────────────────────────── */
  var words = ["∫ f(x) dx", "Na⁺ 140", "pH 7.40", "FCPS", "MS · MD", "σ = 2.1", "Δ merit +0.84", "78.215", "Round 2 → 3", "QRS 0.08s", "HbA1c", "♥ 72 bpm", "K⁺ 4.2", "Σ score", "GCS 15", "SpO₂ 98%", "x̄ ± SD", "MCQ 180", "Hb 13.5", "P < 0.05"];
  if (!reduce) {
    var box = document.getElementById("glyphs"), n = window.innerWidth < 600 ? 12 : 24;
    for (var i = 0; i < n; i++) {
      var g = document.createElement("span");
      g.className = "glyph"; g.textContent = words[i % words.length];
      g.style.left = (Math.random() * 96) + "%";
      g.style.fontSize = (10 + Math.random() * 8) + "px";
      g.style.setProperty("--o", (.2 + Math.random() * .3).toFixed(2));
      g.style.setProperty("--r", (Math.random() * 14 - 7).toFixed(1) + "deg");
      g.style.setProperty("--dx", (Math.random() * 120 - 60).toFixed(0) + "px");
      g.style.animationDuration = (18 + Math.random() * 22) + "s";
      g.style.animationDelay = (-Math.random() * 40) + "s";
      box.appendChild(g);
    }
  }

  /* ── Stars, shooting stars, aurora ────────────────── */
  var sc = document.getElementById("stars"), sx = sc.getContext("2d");
  var ac = document.getElementById("aurora"), ax = ac.getContext("2d");
  var W, H, stars = [], shooters = [], AS = .25;
  function resize() {
    W = sc.clientWidth; H = sc.clientHeight;
    sc.width = W * dpr; sc.height = H * dpr; sx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ac.width = Math.ceil(W * AS); ac.height = Math.ceil(H * AS);
    stars = [];
    var count = Math.round(W * H / 4200);
    for (var i = 0; i < count; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * .85, r: Math.random() * 1.3 + .2, p: Math.random() * 6.28, s: .6 + Math.random() * 2 });
    sizeSparks();
  }
  resize(); window.addEventListener("resize", resize);

  /* Each curtain is a filled band whose lower edge follows slow, summed sine
     waves; a vertical gradient fades it upward. Drawn small, then blurred by
     CSS, so it reads as soft light rather than rays. No flicker. */
  var ribbons = [
    { col: "66,214,208",  base: .40, amp: .060, height: .30, sp: .000045, f: 1.3, ph: 0.0, a: .55 },
    { col: "95,211,154",  base: .33, amp: .070, height: .26, sp: .000035, f: 1.0, ph: 1.9, a: .45 },
    { col: "31,127,128",  base: .47, amp: .050, height: .34, sp: .000028, f: 0.8, ph: 3.7, a: .65 },
    { col: "107,227,222", base: .26, amp: .045, height: .18, sp: .000052, f: 1.7, ph: 5.1, a: .30 }
  ];
  var energy = 0, smooth = 0; // music level, eased again so the sky never jumps
  function edge(rb, u, t) {
    return rb.base
      + Math.sin(u * rb.f * 6.283 + t * rb.sp * 6.283 + rb.ph) * rb.amp
      + Math.sin(u * rb.f * 2.3 * 6.283 - t * rb.sp * 4.1 + rb.ph * 1.3) * rb.amp * .45;
  }
  function drawAurora(t) {
    var w = ac.width, h = ac.height;
    smooth += (energy - smooth) * .03;
    ax.globalCompositeOperation = "source-over"; ax.clearRect(0, 0, w, h);
    ax.globalCompositeOperation = "lighter";
    ribbons.forEach(function (rb, k) {
      var breathe = .8 + .2 * Math.sin(t * .00018 + k * 1.7);
      var alpha = rb.a * breathe * (1 + smooth * .9);
      var top = (rb.base - rb.amp - rb.height * (1 + smooth * .3)) * h;
      var bottom = (rb.base + rb.amp * 1.5) * h;
      var gr = ax.createLinearGradient(0, top, 0, bottom);
      gr.addColorStop(0, "rgba(" + rb.col + ",0)");
      gr.addColorStop(.65, "rgba(" + rb.col + "," + (alpha * .35).toFixed(3) + ")");
      gr.addColorStop(.9, "rgba(" + rb.col + "," + Math.min(1, alpha).toFixed(3) + ")");
      gr.addColorStop(1, "rgba(" + rb.col + ",0)");
      ax.fillStyle = gr;
      ax.beginPath();
      var step = w / 40;
      for (var x = 0; x <= w + step; x += step) {
        var u = x / w, y = edge(rb, u, t) * h;
        var lift = rb.height * h * (1 + smooth * .3) * (.75 + .25 * Math.sin(u * 3.1 + t * rb.sp * 3 + rb.ph));
        if (x === 0) ax.moveTo(x, y - lift); else ax.lineTo(x, y - lift);
      }
      for (var x2 = w + step; x2 >= -step; x2 -= step) {
        var u2 = x2 / w; ax.lineTo(x2, edge(rb, u2, t) * h + rb.amp * .6 * h);
      }
      ax.closePath(); ax.fill();
    });
    // fade the sides so the curtains sit inside the sky
    ax.globalCompositeOperation = "destination-in";
    var side = ax.createLinearGradient(0, 0, w, 0);
    side.addColorStop(0, "rgba(0,0,0,.25)"); side.addColorStop(.2, "#000");
    side.addColorStop(.8, "#000"); side.addColorStop(1, "rgba(0,0,0,.25)");
    ax.fillStyle = side; ax.fillRect(0, 0, w, h);
  }
  function drawStars(t) {
    sx.clearRect(0, 0, W, H);
    sx.fillStyle = "#f2f6fc";
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      sx.globalAlpha = reduce ? .8 : (.6 + .4 * Math.sin(t * .0006 * s.s + s.p)) * .8;
      sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 6.283); sx.fill();
    }
    sx.globalAlpha = 1;
    if (!reduce && Math.random() < .002) shooters.push({ x: Math.random() * W * .8 + W * .1, y: Math.random() * H * .35, vx: -(6 + Math.random() * 6), vy: 3 + Math.random() * 3, life: 1 });
    for (var j = shooters.length - 1; j >= 0; j--) {
      var p = shooters[j]; p.x += p.vx; p.y += p.vy; p.life -= .02;
      if (p.life <= 0) { shooters.splice(j, 1); continue; }
      var g = sx.createLinearGradient(p.x, p.y, p.x - p.vx * 12, p.y - p.vy * 12);
      g.addColorStop(0, "rgba(255,255,255," + p.life + ")"); g.addColorStop(1, "rgba(255,255,255,0)");
      sx.strokeStyle = g; sx.lineWidth = 1.6;
      sx.beginPath(); sx.moveTo(p.x, p.y); sx.lineTo(p.x - p.vx * 12, p.y - p.vy * 12); sx.stroke();
    }
  }

  /* Parallax: pointer on desktop, slow orbit otherwise */
  var sky = document.getElementById("sky"), stack = document.getElementById("stack"), px = 0, py = 0;
  window.addEventListener("pointermove", function (e) { px = e.clientX / innerWidth - .5; py = e.clientY / innerHeight - .5; });

  var running = true;
  document.addEventListener("visibilitychange", function () { running = !document.hidden; if (running && !reduce) requestAnimationFrame(frame); });
  function frame(t) {
    if (!running) return;
    if (analyser) {
      analyser.getByteFrequencyData(freq);
      var sum = 0; for (var i = 0; i < 24; i++) sum += freq[i];
      energy += ((sum / (24 * 255)) - energy) * .08;
    } else energy *= .95;
    drawAurora(t); drawStars(t); sparkFrame();
    sky.style.transform = "translate(" + (px * -18) + "px," + (py * -12) + "px)";
    stack.style.transform = "translate(" + (px * 10) + "px," + (py * 8) + "px)";
    if (!reduce) requestAnimationFrame(frame);
  }
  var analyser = null, freq = null;
  requestAnimationFrame(frame);

  /* ── Ambient music, synthesized live (no audio files) ── */
  var Ctx = window.AudioContext || window.webkitAudioContext;
  var btn = document.getElementById("sound"), note = document.getElementById("note");
  var ctx, master, bus, playing = false, nextChord = 0, chordIx = 0, timer;
  var CHORDS = [[48, 55, 59, 64], [45, 52, 55, 60], [41, 48, 52, 57], [43, 50, 55, 62]];
  var MELODY = [72, 74, 76, 79, 81, 84], BAR = 8;
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function impulse(sec, decay) {
    var len = ctx.sampleRate * sec, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = b.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function setup() {
    ctx = new Ctx();
    master = ctx.createGain(); master.gain.value = 0;
    var comp = ctx.createDynamicsCompressor();
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; freq = new Uint8Array(analyser.frequencyBinCount);
    master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300; lp.Q.value = .4;
    var lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = .05; lfoG.gain.value = 500;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    var rev = ctx.createConvolver(); rev.buffer = impulse(5, 2.4);
    var wet = ctx.createGain(); wet.gain.value = .7;
    var dry = ctx.createGain(); dry.gain.value = .5;
    bus = ctx.createGain(); bus.gain.value = .9;
    bus.connect(lp); lp.connect(dry); lp.connect(rev); rev.connect(wet); dry.connect(master); wet.connect(master);
    var nb = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate), nd = nb.getChannelData(0), last = 0;
    for (var i = 0; i < nd.length; i++) { var w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; nd[i] = last * 3.2 + (Math.random() < .0004 ? (Math.random() - .5) * .6 : 0); }
    var ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    var nf = ctx.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 1100; nf.Q.value = .6;
    var ng = ctx.createGain(); ng.gain.value = .06;
    ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();
  }
  function voice(f, st, dur, type, peak, det) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f; o.detune.value = det || 0;
    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(peak, st + 2.4);
    g.gain.setValueAtTime(peak, st + dur - 2.6); g.gain.linearRampToValueAtTime(0, st + dur + 1.8);
    o.connect(g); g.connect(bus); o.start(st); o.stop(st + dur + 2);
  }
  function pluck(f, st) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(.05, st + .015);
    g.gain.exponentialRampToValueAtTime(.0001, st + 2.2);
    o.connect(g); g.connect(bus); o.start(st); o.stop(st + 2.3);
  }
  function schedule() {
    while (nextChord < ctx.currentTime + 1.5) {
      var ch = CHORDS[chordIx % CHORDS.length];
      ch.forEach(function (m) { voice(hz(m), nextChord, BAR, "triangle", .035, -7); voice(hz(m), nextChord, BAR, "sine", .03, 6); });
      voice(hz(ch[0] - 12), nextChord, BAR, "sine", .06, 0);
      for (var b = 0; b < 8; b++) if (Math.random() < .38) pluck(hz(MELODY[(Math.random() * MELODY.length) | 0]), nextChord + b + Math.random() * .2);
      nextChord += BAR; chordIx++;
    }
  }
  function setUI() {
    btn.classList.toggle("on", playing);
    btn.setAttribute("aria-pressed", String(playing));
    btn.setAttribute("aria-label", playing ? "Pause background music" : "Play background music");
  }
  function store(v) { try { localStorage.setItem("meritnama_music", v); } catch (e) {} }
  function play() {
    if (!Ctx) return;
    if (!ctx) setup();
    ctx.resume();
    if (nextChord < ctx.currentTime) nextChord = ctx.currentTime + .1;
    schedule(); clearInterval(timer); timer = setInterval(schedule, 400);
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.55, ctx.currentTime + 2.5);
    playing = true; setUI(); store("on"); note.classList.add("gone");
  }
  function pause() {
    if (!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
    clearInterval(timer); setTimeout(function () { if (!playing) ctx.suspend(); }, 1200);
    playing = false; setUI(); store("off");
  }
  if (!Ctx) { btn.hidden = true; note.hidden = true; }
  btn.addEventListener("click", function (e) { e.stopPropagation(); playing ? pause() : play(); });
  window.addEventListener("pointerdown", function first(e) {
    if (e.target === btn || btn.contains(e.target)) return;
    window.removeEventListener("pointerdown", first);
    if (!playing) play();
  });
  window.addEventListener("keydown", function (e) { if (e.key === "m" || e.key === "M") playing ? pause() : play(); });
  setTimeout(function () { note.classList.add("gone"); }, 12000);
})();
</script>
